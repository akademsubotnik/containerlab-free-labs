    r2:
      mgmt-ipv4: 192.168.0.3
      kind: cisco_csr1000v
      image: edwin71/cisco-csr1000v:17.03.08
      env:
        USERNAME : 'admin'
        PASSWORD : 'admin'      
      binds:
        - configs/r2/frr.cfg:/etc/frr/frr.conf
      labels:
        lab-name: "netrestconf Basics"
        router-name: "snmpmanager"


    r3:
      mgmt-ipv4: 192.168.0.4
      kind: cisco_csr1000v
      image: edwin71/cisco-csr1000v:17.03.08
      env:
        USERNAME : 'admin'
        PASSWORD : 'admin'      
      binds:
        #- scripts/deploy-script.sh:/tmp/deploy-script.sh
        - configs/r3/frr.cfg:/etc/frr/frr.conf      
      # entrypoint: "/bin/sh tmp/deploy-script.sh"
      labels:
        lab-name: "netrestconf Basics"
        router-name: "snmpclient"
#mirror another R2 (cisco_csr1000v for snmp manager and snmp agent)
# with endpoint connections!    

  links:
    - endpoints: ["r2:eth1", "r3:eth1"]  