    r2:
      mgmt-ipv4: 172.20.20.3
      kind: cisco_csr1000v
      image: edwin71/cisco-csr1000v:17.03.08
      env:
        USERNAME : 'admin'
        PASSWORD : 'admin'      
      startup-config: configs/r2/frr.txt
      #ports:
      #  - 2222:22  # SSH access
      labels:
        lab-name: "netrestconf Basics"
        router-name: "snmpmanager"

    r3:
      mgmt-ipv4: 172.20.20.4
      kind: cisco_csr1000v
      image: edwin71/cisco-csr1000v:17.03.08
      env:
        USERNAME : 'admin'
        PASSWORD : 'admin'      
      startup-config: configs/r3/frr.txt
      #ports:
      #  - 2223:22  # SSH access
      labels:
        lab-name: "netrestconf Basics"
        router-name: "snmpclient"

  links:
    - endpoints: ["r2:eth1", "r3:eth1"]  #GigabitEthernet2 on both routers , # 10.0.3.0/24