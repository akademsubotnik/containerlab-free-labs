name: netconf-restconf-basics
#NETCONF and RESTCONF use yml to 
topology:
  nodes:
    r1:
      kind: linux
      image: frr-ssh:latest
      binds:
        - configs/r1/daemons:/etc/frr/daemons
        - configs/r1/frr.conf:/etc/frr/frr.conf
      ports:
        - 2221:22  # SSH access (UN:admin PW:cisco)
      labels:
        lab-name: "netrestconf Basics"
        router-name: "R1"
      
    r2:
      kind: cisco_csr1000v
      image: edwin71/cisco-csr1000v:17.03.08
      binds:
      #  - configs/r2/r2-config.txt:/etc/frr/daemons
        - configs/r2/frr.conf:/etc/frr/frr.conf
      ports:
        #- 2222:22  # SSH access (UN:admin/PW:admin)
        - 443:443/tcp   # Exposes HTTPS/RESTCONF
        - 80:80/tcp     # Exposes HTTP
      startup-config: configs/r2/r2-config.txt #Maps your config file
      labels:
        lab-name: "netrestconf Basics"
        router-name: "R2-snmpmanager"


    r3:
      kind: cisco_csr1000v
      image: edwin71/cisco-csr1000v:17.03.08
      binds:
      #  - configs/r2/r2-config.txt:/etc/frr/daemons
        - configs/r3/frr.conf:/etc/frr/frr.conf
      #ports:
        #- 2222:22  # SSH access (UN:admin/PW:admin)
      #  - 443:443/tcp   # Exposes HTTPS/RESTCONF
      #  - 80:80/tcp     # Exposes HTTP
      #startup-config: configs/r3/r3-config.txt #Maps your config file
      labels:
        lab-name: "netrestconf Basics"
        router-name: "R3-snmpclient"
#mirror another R2 (cisco_csr1000v for snmp manager and snmp agent)
# with endpoint connections!



  links:
    - endpoints: ["r2:eth1", "r3:eth1"]  