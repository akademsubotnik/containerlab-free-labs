name: netconf-restconf-basics

mgmt:
  network: clab-mgmt
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: 3fff:172:20:20::/64

topology:
  nodes:
    # r1:
    #   mgmt-ipv4: 192.168.0.3
    #   kind: linux
    #   image: treasureboat/ssh:latest
    #   env:
    #     USERNAME : 'admin'
    #     PASSWORD : 'admin'
    #   binds:
    #     - configs/r1/daemons:/etc/frr/daemons
    #     - configs/r1/frr.cfg:/etc/frr/frr.conf
    #   ports:
    #     - 2221:22  # SSH access (UN:admin PW:cisco)
    #   labels:
    #     lab-name: "netrestconf Basics"
